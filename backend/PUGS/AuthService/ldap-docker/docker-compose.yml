version: '3.8'

services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: pugs-openldap
    environment:
      LDAP_ORGANISATION: "PUGS Org"
      LDAP_DOMAIN: "pugs.local"
      LDAP_ADMIN_PASSWORD: "AdminPass123"
      LDAP_BASE_DN: "dc=pugs,dc=local"
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    restart: unless-stopped

  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: pugs-phpldapadmin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8081:80"
    depends_on:
      - openldap
    restart: unless-stopped

volumes:
  ldap_data:
  ldap_config: